name: Generate Android Keystore

# One-shot helper: creates the release signing keystore used by android.yml.
# Run it once, download the `android-keystore` artifact, then store the three
# values as repository secrets:
#
#   ANDROID_KEY_BASE64   -> base64 of keystore.jks
#   ANDROID_KEY_ALIAS    -> key alias
#   ANDROID_KEY_PASSWORD -> keystore + key password
#
# The artifact is only kept for a short window; delete the run afterwards.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          set -euo pipefail
          PASS="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -storetype PKCS12 \
            -alias opencode \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=OpenCodeUI, OU=Android, O=OpenCodeUI, C=NA"
          base64 -w0 keystore.jks > keystore.b64
          printf '%s' "$PASS" > keystore-password.txt
          printf '%s' "opencode" > keystore-alias.txt

      - name: Upload keystore
        uses: actions/upload-artifact@v7
        with:
          name: android-keystore
          path: |
            keystore.b64
            keystore-password.txt
            keystore-alias.txt
          retention-days: 1
