name: Android Universal APK

# Builds one APK that carries BOTH 64-bit (arm64-v8a) and 32-bit (armeabi-v7a)
# native libraries, so the app installs on 64-bit and legacy 32-bit devices
# alike.
#
# The APK is self contained: it carries the Node.js runtime (built for bionic),
# ripgrep and the opencode server bundle, so the app *is* the opencode server.
#
# Flow:
#   1. node-runtime  : Node.js for arm64 + armv7 (reusable workflow)
#   2. server-bundle : opencode v2 server as a Node bundle (reusable workflow)
#   3. build-abi     : embed runtime + bundle, build one APK per ABI
#   4. merge         : splice both lib/<abi> trees into a single universal APK,
#                      align it and sign it with the release key
#
# Publishing a GitHub release is a separate, manual workflow (release.yml).

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'feature/**'
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-universal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Embedded runtime + server bundle
  # ============================================
  node-runtime:
    name: Node runtime
    uses: ./.github/workflows/node-android.yml

  server-bundle:
    name: opencode server bundle
    uses: ./.github/workflows/opencode-bundle.yml

  # ============================================
  # Per-ABI builds
  # ============================================
  build-abi:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: [node-runtime, server-bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            rust_target: aarch64-linux-android
            label: arm64
            arch: arm64
            abi: arm64-v8a
            node_triple: aarch64-linux-android
          - target: armv7
            rust_target: armv7-linux-androideabi
            label: armv7
            arch: arm
            abi: armeabi-v7a
            node_triple: armv7a-linux-androideabi

    env:
      NDK_VERSION: '29.0.14206865'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # The legacy `tools` package was removed from the SDK repo, so only
      # platform-tools + build-tools are requested here.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'

      - run: sdkmanager "ndk;$NDK_VERSION"

      # --- embedded payload ------------------------------------------------

      - name: Download Node runtime
        uses: actions/download-artifact@v8
        with:
          name: node-android-${{ matrix.arch }}
          path: node-runtime

      - name: Download ripgrep
        uses: actions/download-artifact@v8
        with:
          name: ripgrep-android-${{ matrix.arch }}
          path: ripgrep

      - name: Download opencode server bundle
        uses: actions/download-artifact@v8
        with:
          name: opencode-server-bundle-latest
          path: server-bundle

      - name: Embed runtime + server
        run: |
          set -euo pipefail
          LIBDIR="src-tauri/gen/android/app/src/main/jniLibs/${{ matrix.abi }}"
          ASSETS="src-tauri/gen/android/app/src/main/assets/opencode"
          mkdir -p "$LIBDIR" "$ASSETS"

          NODE=$(find node-runtime -type f -name node | head -1)
          [ -n "$NODE" ] || { echo "::error::node runtime artifact is empty"; exit 1; }
          cp "$NODE" "$LIBDIR/libopencode_node.so"
          chmod 755 "$LIBDIR/libopencode_node.so"

          RG=$(find ripgrep -type f -name rg | head -1)
          [ -n "$RG" ] || { echo "::error::ripgrep artifact is empty"; exit 1; }
          cp "$RG" "$LIBDIR/librg.so"
          chmod 755 "$LIBDIR/librg.so"

          # libc++_shared resolved from nativeLibraryDir when the runtime
          # needs it (harmless when node links it statically).
          LLVM="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          CXX_SHARED="$LLVM/sysroot/usr/lib/${{ matrix.node_triple }}/libc++_shared.so"
          if [ -f "$CXX_SHARED" ]; then
            cp "$CXX_SHARED" "$LIBDIR/libc++_shared.so"
          fi

          ENTRY=$(find server-bundle -name opencode.mjs | head -1)
          [ -n "$ENTRY" ] || { echo "::error::server bundle artifact is empty"; exit 1; }
          SRC=$(dirname "$ENTRY")
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp -R "$SRC/." "$ASSETS/"
          # The native installer compares this marker and skips recopies.
          # (Not a dotfile: aapt2 drops hidden asset entries.)
          date -u +%Y%m%d%H%M%S > "$ASSETS/bundle-version.txt"

          echo "--- payload ---"
          ls -lh "$LIBDIR"
          du -sh "$ASSETS"
          ls "$ASSETS" | head -20

      # --- build ------------------------------------------------------------

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android-${{ matrix.target }}

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src-tauri/gen/android/.gradle
          key: gradle-${{ matrix.target }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: npm ci

      - name: Setup Android signing
        run: |
          set -euo pipefail
          # Gradle signs the per-ABI APK with the release key; the merged
          # universal APK is re-signed after the merge step.
          if [ -n "${{ secrets.ANDROID_KEY_BASE64 }}" ]; then
            cd src-tauri/gen/android
            base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
            {
              echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}"
              echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
              echo "storeFile=$RUNNER_TEMP/keystore.jks"
            } > keystore.properties
          else
            echo "::warning::ANDROID_KEY_BASE64 not configured - per-ABI APKs will be signed in the merge job only"
          fi

      - name: Build APK (${{ matrix.label }})
        run: npx tauri android build --apk --target ${{ matrix.target }}
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "no APK produced for ${{ matrix.label }}" >&2
            exit 1
          fi
          cp "$APK" "out/OpenCodeUI-${{ matrix.label }}.apk"
          ls -lh out/

          echo "--- embedded payload in the APK ---"
          unzip -l "out/OpenCodeUI-${{ matrix.label }}.apk" |
            grep -E "lib/${{ matrix.abi }}/(libopencode_node|librg|libc\+\+_shared)\.so|assets/opencode/opencode\.mjs" ||
            { echo "::error::embedded payload missing from the APK"; exit 1; }

          echo "--- native lib extraction ---"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree \
            "out/OpenCodeUI-${{ matrix.label }}.apk" --file AndroidManifest.xml |
            grep -i extractNativeLibs || echo "::warning::extractNativeLibs not found in the manifest"

      - uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.label }}
          path: out/*.apk
          retention-days: 7

  # ============================================
  # Merge into a universal APK + sign
  # ============================================
  merge:
    name: Merge universal APK
    runs-on: ubuntu-latest
    needs: build-abi

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'

      - uses: actions/download-artifact@v8
        with:
          name: apk-arm64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: apk-armv7
          path: dist

      - name: Display artifacts
        run: ls -lR dist

      - name: Merge ABIs
        run: |
          python3 scripts/merge-universal-apk.py \
            dist/OpenCodeUI-arm64.apk \
            dist/OpenCodeUI-armv7.apk \
            dist/universal-unaligned.apk

      - name: Align
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 dist/universal-unaligned.apk dist/universal-aligned.apk
          "$BT/zipalign" -c -p 4 dist/universal-aligned.apk

      - name: Verify merged payload
        run: |
          set -euo pipefail
          for entry in \
            "lib/arm64-v8a/libopencode_node.so" \
            "lib/armeabi-v7a/libopencode_node.so" \
            "lib/arm64-v8a/librg.so" \
            "lib/armeabi-v7a/librg.so" \
            "assets/opencode/opencode.mjs"; do
            if ! unzip -l dist/universal-aligned.apk | grep -q "$entry"; then
              echo "::error::missing from universal APK: $entry"
              exit 1
            fi
          done
          unzip -l dist/universal-aligned.apk | grep -E "lib/.*\.so" | awk '{print $1, $4}'

      - name: Prepare signing key
        id: signing
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.ANDROID_KEY_BASE64 }}" ]; then
            base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
            echo "alias=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_OUTPUT"
            echo "pass=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "source=repository secret" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEY_BASE64 is not configured - falling back to an ephemeral key. Reinstalls will require uninstalling the previous build."
            PASS="ephemeral-$(date +%s)"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/keystore.jks" \
              -storetype PKCS12 \
              -alias opencode \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=OpenCodeUI, OU=Dev, O=OpenCodeUI, C=NA"
            echo "alias=opencode" >> "$GITHUB_OUTPUT"
            echo "pass=$PASS" >> "$GITHUB_OUTPUT"
            echo "source=ephemeral" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          VERSION=$(node -p "require('./package.json').version")
          OUT="dist/OpenCodeUI-${VERSION}-android-universal.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-key-alias "${{ steps.signing.outputs.alias }}" \
            --ks-pass "pass:${{ steps.signing.outputs.pass }}" \
            --key-pass "pass:${{ steps.signing.outputs.pass }}" \
            --out "$OUT" \
            dist/universal-aligned.apk
          echo "--- signature ---"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | head -30
          "$BT/apksigner" verify "$OUT"
          echo "--- universal APK ---"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: apk-universal
          path: dist/OpenCodeUI-*-android-universal.apk
          retention-days: 30
